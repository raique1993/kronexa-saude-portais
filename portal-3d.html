<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador 3D — Kronexa</title>
<script>if(location.protocol!=="https:"&&location.hostname!=="localhost")location.replace("https://"+location.host+location.pathname+location.search);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F8FAFC;color:var(--t1);font-family:-apple-system,sans-serif;height:100vh;display:grid;grid-template-rows:44px 1fr;overflow:hidden}
.hd{background:#0F1128;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 14px;gap:10px}
.logo{font-size:13px;font-weight:900}.logo span{color:#0D9488}
.tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;background:rgba(13,148,136,.12);color:var(--p)}
.hd-btn{height:28px;padding:0 12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.02);color:#888;border-radius:7px;font-size:11px;cursor:pointer;margin-left:auto}
.hd-btn:hover{background:rgba(13,148,136,.12);color:#fff}
#viewer{width:100%;height:100%;display:block}
.controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.95);padding:6px;border-radius:10px;z-index:10}
.ctrl{padding:8px 14px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:transparent;color:#aaa;cursor:pointer;font-size:11px;transition:.15s}
.ctrl:hover{background:rgba(13,148,136,.25);color:#fff}
.ctrl.on{background:#0D9488;color:var(--t1);border-color:#0D9488}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:100px;font-size:12px;background:#0D9488;color:var(--t1);z-index:99}
</style>
</head>
<body>
<header class="hd">
  <div class="logo">KRO<span>NEXA</span></div><span class="tag">3D</span>
  <select id="exam-select" style="background:#1a1c3a;border:1px solid rgba(255,255,255,.1);color:var(--t1);padding:4px 8px;border-radius:5px;font-size:11px" onchange="loadExam(this.value)"><option>Selecione um exame...</option></select>
  <button class="hd-btn" onclick="window.location.href='portal-medico.html'">← Voltar</button>
</header>
<div id="viewer"></div>
<div class="controls">
  <button class="ctrl on" onclick="setMode('rotate')">🔄 Rotação</button>
  <button class="ctrl" onclick="setMode('zoom')">🔍 Zoom</button>
  <button class="ctrl" onclick="setMode('pan')">✋ Mover</button>
  <button class="ctrl" onclick="resetView()">🏠 Reset</button>
</div>

<script>
const SB='https://tcjynyfusqkqtdohnyzq.supabase.co', KEY='sb_publishable_gNJhc4WCS9MnnmDAL2T6Vg_AQ71_Vid';
const CID=localStorage.getItem('KRONEXA_CID')||'c1d2e3f4-0001-0000-0000-000000000001';
const sb=supabase.createClient(SB,KEY);

let scene,camera,renderer,cube,mode='rotate',isDragging=false,prevMouse={x:0,y:0};

// Init Three.js
const container=document.getElementById('viewer');
const W=container.clientWidth,H=container.clientHeight;
scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a1a);
camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);camera.position.set(2,2,3);camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(W,H);container.appendChild(renderer.domElement);

// Iluminação
scene.add(new THREE.AmbientLight(0x444466,3));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(5,5,5);scene.add(light);
scene.add(new THREE.DirectionalLight(0x8888ff,1).position.set(-3,-2,-3));

// Grid + Eixos
const grid=new THREE.GridHelper(3,20,0x333366,0x111133);grid.position.y=-1.5;scene.add(grid);
function axis(dir,color){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),dir.clone().multiplyScalar(2)]);scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));}
axis(new THREE.Vector3(1,0,0),0xff0000); // X
axis(new THREE.Vector3(0,1,0),0x00ff00); // Y
axis(new THREE.Vector3(0,0,1),0x0000ff); // Z

// Volume placeholder com textura
const group=new THREE.Group();scene.add(group);
const loader=new THREE.TextureLoader();loader.crossOrigin='anonymous';

function loadExam(id){
  if(!id)return;
  sb.from('kh_exames').select('*').eq('id',id).single().then(({data})=>{
    if(!data?.url)return;
    group.clear();
    // Criar multiplas slices como volume
    loader.load(data.url,tex=>{
      const asp=tex.image.width/tex.image.height;
      for(let i=0;i<10;i++){
        const z=(i-4.5)*0.04;
        const g=new THREE.PlaneGeometry(1.5,1.5/asp);
        const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.1,side:THREE.DoubleSide});
        const s=new THREE.Mesh(g,m);s.position.z=z;group.add(s);
      }
      // Wireframe
      const bg=new THREE.BoxGeometry(1.5,1.5/asp,0.4);
      group.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:0x6C3FE8,opacity:.6,transparent:true})));
      toast('✅ Exame carregado em 3D');
    });
  });
}

// Mouse controls
container.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY}});
container.addEventListener('mousemove',e=>{if(!isDragging)return;const dx=e.clientX-prevMouse.x;const dy=e.clientY-prevMouse.y;prevMouse={x:e.clientX,y:e.clientY};if(mode==='rotate'){group.rotation.y+=dx*0.01;group.rotation.x+=dy*0.01}else if(mode==='zoom'){camera.position.z-=dy*0.02;camera.position.z=Math.max(0.5,Math.min(10,camera.position.z))}else if(mode==='pan'){camera.position.x-=dx*0.005;camera.position.y+=dy*0.005}});
container.addEventListener('mouseup',()=>{isDragging=false});
container.addEventListener('wheel',e=>{camera.position.z+=e.deltaY*0.005;camera.position.z=Math.max(0.5,Math.min(10,camera.position.z))});

function setMode(m){mode=m;document.querySelectorAll('.ctrl').forEach(b=>b.classList.remove('on'));event.target.classList.add('on')}
function resetView(){camera.position.set(2,2,3);camera.lookAt(0,0,0);group.rotation.set(0,0,0);toast('🔄 Reset')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

// Animação
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();

// NUNCA carregar todos exames — so carrega quando usuario selecionar
document.getElementById('exam-select').innerHTML='<option>Selecione um exame...</option>';

window.addEventListener('resize',()=>{const c=container;camera.aspect=c.clientWidth/c.clientHeight;camera.updateProjectionMatrix();renderer.setSize(c.clientWidth,c.clientHeight)});
</script>
</body>
</html>
